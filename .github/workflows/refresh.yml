name: Refresh Emas

on:
  schedule:
    - cron: '0 0 * * *'   # 1x sehari 07:00 WIB (hemat kuota)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TELE_BOT: ${{ secrets.LAMPU_EMAS_BOT }}
      TELE_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_BOT: ${{ secrets.OPENCODEKU_BOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps + NLTK data
        run: |
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Collect + Paper
        run: |
          python collect.py
          python paper_gold.py
          python paper_gold_st.py

      - name: Commit data kembali
        run: |
          git config user.name "emas-bot"
          git config user.email "emas-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "auto: refresh emas [skip ci]"
          git push origin main

      - name: Notif vonis Telegram
        if: env.TELE_BOT != ''
        run: |
          MSG=$(python - <<'PYEOF'
          import json
          s = json.load(open('data/gold_sentiment.json', encoding='utf-8'))
          c = s.get('cot') or {}
          print(f"Emas ${s.get('harga'):,.1f} - {s.get('vonis')}".replace(',', '.'))
          print(f"Sentimen {s.get('avg_compound')} (n={s.get('n')}, fear={s.get('fear_hits')})")
          if c.get('date'):
              print(f"COT {c['date']}: MM {c['mm_net']:+,} ({c['mm_pct_oi']}% OI)".replace(',', '.'))
          print(s.get('waktu', ''))
          PYEOF
          )
          curl -s -X POST "https://api.telegram.org/bot${TELE_BOT}/sendMessage" \
            -d "chat_id=${TELE_CHAT}" --data-urlencode "text=${MSG}" > /dev/null
          echo "digest terkirim (lampu_emas_bot)"

      - name: Notif status deploy (Opencodeku)
        if: always() && env.DEPLOY_BOT != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${DEPLOY_BOT}/sendMessage" \
            -d "chat_id=${TELE_CHAT}" \
            --data-urlencode "text=emas refresh: ${{ job.status }} ($(date -u +%Y-%m-%dT%H:%MZ))" > /dev/null
          echo "notif deploy terkirim (opencodekubot)"
