name: Refresh Emas

on:
  schedule:
    - cron: '0 0 * * *'   # 1x sehari 07:00 WIB (hemat kuota)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TELE_BOT: ${{ secrets.LAMPU_EMAS_BOT }}
      TELE_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_BOT: ${{ secrets.OPENCODEKU_BOT }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps + NLTK data
        run: |
          pip install -r requirements.txt
          python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"

      - name: Collect + Paper
        run: |
          python collect.py
          python paper_gold.py
          python paper_gold_st.py

      - name: Commit data kembali
        run: |
          git config user.name "emas-bot"
          git config user.email "emas-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "auto: refresh emas [skip ci]"
          git push origin main

      - name: Export + push Space
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python export_static.py
          rm -rf /tmp/space && git clone "https://120n1aja:${HF_TOKEN}@huggingface.co/spaces/120n1aja/emassentimen" /tmp/space
          cp static/index.html /tmp/space/index.html
          mkdir -p /tmp/space/data && cp static/data/*.json /tmp/space/data/
          cd /tmp/space && git config user.name "emas-bot" && git config user.email "emas-bot@users.noreply.github.com"
          git add -A && git diff --cached --quiet || git commit -m "auto refresh"
          git push origin main

      - name: Notif vonis Telegram
        if: env.TELE_BOT != ''
        run: |
          MSG=$(python - <<'PYEOF'
          import json
          s = json.load(open('data/gold_sentiment.json', encoding='utf-8'))
          c = s.get('cot') or {}
          print(f"Emas ${s.get('harga'):,.1f} - {s.get('vonis')}".replace(',', '.'))
          print(f"Sentimen {s.get('avg_compound')} (n={s.get('n')}, fear={s.get('fear_hits')})")
          if c.get('date'):
              print(f"COT {c['date']}: MM {c['mm_net']:+,} ({c['mm_pct_oi']}% OI)".replace(',', '.'))
          try:
              p1 = json.load(open('data/paper_gold_state.json', encoding='utf-8'))
              t1 = json.load(open('data/paper_gold_trades.json', encoding='utf-8'))
              r1 = (p1.get('equity', 10000) / 10000 - 1) * 100
              print(f"Paper: {r1:+.1f}% ({len(t1)} trade)")
          except Exception:
              pass
          try:
              p2 = json.load(open('data/paper_st_state.json', encoding='utf-8'))
              t2 = json.load(open('data/paper_st_trades.json', encoding='utf-8'))
              r2 = (p2.get('equity', 10000) / 10000 - 1) * 100
              sg = p2.get('signal') or {}
              print(f"Paper-ST {sg.get('trend', '?')}: {r2:+.1f}% ({len(t2)} trade)")
          except Exception:
              pass
          print(s.get('waktu', ''))
          PYEOF
          )
          curl -s -X POST "https://api.telegram.org/bot${TELE_BOT}/sendMessage" \
            -d "chat_id=${TELE_CHAT}" --data-urlencode "text=${MSG}" > /dev/null
          echo "digest terkirim (lampu_emas_bot)"

      - name: Notif status deploy (Opencodeku)
        if: always() && env.DEPLOY_BOT != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${DEPLOY_BOT}/sendMessage" \
            -d "chat_id=${TELE_CHAT}" \
            --data-urlencode "text=emas refresh: ${{ job.status }} ($(date -u +%Y-%m-%dT%H:%MZ))" > /dev/null
          echo "notif deploy terkirim (opencodekubot)"
